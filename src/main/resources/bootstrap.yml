app:
  port: ${APP_PORT:8080}
  logging: debug
  server: ${APP_SERVER:server}
  database: ${APP_DATABASE:database}
  username: ${APP_USERNAME:username}
  password: ${APP_PASSWORD:password}
  testing: ${APP_TESTING:false}
  consul:
    host: consul-service
    port: 8500

server:
  port: ${app.port}

spring:
  application:
    name: tesoreria-guarani-service
  datasource:
    url: jdbc:postgresql://${app.server}/${app.database}
    username: ${app.username}
    password: ${app.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 200000
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        # Solo resolver instancias con los checks en passing (Feign/LoadBalancer).
        query-passing: true
        # Consul: readiness (sin dependencias) + poda si queda critico.
        health-check-path: /actuator/health/readiness
        health-check-critical-timeout: 5m
        tags: tesoreria,guarani

tesoreria:
  audit:
    # OFF = no captura | LOG = captura y loguea | SEND = cola en memoria + HTTP
    # Default SEND: la auditoría se registra desde el primer request.
    mode: ${TESORERIA_AUDIT_MODE:SEND}
    request-events: ${TESORERIA_AUDIT_REQUEST_EVENTS:true}
    # Guarani sólo lee: las consultas son el evento que hay que registrar.
    access-events: ${TESORERIA_AUDIT_ACCESS_EVENTS:true}
    # Escrituras (cuando empiecen a existir): listeners de JPA con diff enmascarado.
    change-events: ${TESORERIA_AUDIT_CHANGE_EVENTS:true}
    url: ${TESORERIA_AUDIT_URL:http://localhost:8211}
    api-key: ${TESORERIA_AUDIT_API_KEY:}
    queue-capacity: ${TESORERIA_AUDIT_QUEUE_CAPACITY:2000}
    batch-size: ${TESORERIA_AUDIT_BATCH_SIZE:200}
    max-attempts: ${TESORERIA_AUDIT_MAX_ATTEMPTS:10}
    sender-delay-ms: ${TESORERIA_AUDIT_SENDER_DELAY_MS:2000}
    sender-initial-delay-ms: ${TESORERIA_AUDIT_SENDER_INITIAL_DELAY_MS:5000}
    max-payload-chars: ${TESORERIA_AUDIT_MAX_PAYLOAD_CHARS:32768}
    # Datos personales: nunca en texto plano en la auditoría.
    mask-fields: ${TESORERIA_AUDIT_MASK_FIELDS:password,clave,autenticacion,token,tokenAlta,email,emailTemporal,cbu,cuenta,documento,nroDocumento,telefono,telefonoCodigoArea,telefonoNumero,celular}
    include-prefixes: ${TESORERIA_AUDIT_INCLUDE_PREFIXES:/api/tesoreria/guarani}

logging:
  level:
    um.tesoreria.guarani: ${app.logging}
    web: ${app.logging}
    org:
      springframework:
        web: ${app.logging}
        cloud: ${app.logging}
        security: ${app.logging}
    feign: ${app.logging}
    feign.hystrix: ${app.logging}
